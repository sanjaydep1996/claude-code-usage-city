<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DevCity · Personal AI Developer Cockpit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #EEF1F7; --bg2: #DCE2EF; --ink: #0F172A; --dim: #5B6478; --card: rgba(255,255,255,.94); --line: #D5DBE7;
    --ground: #E4EAE2; --lot: #F3F5FA; --road: #CCD4E2; --dash: #FFFFFF; --win: #CFE0FF; --winGlow: .1;
    --shadow: 0 18px 50px rgba(15,23,42,.14); --accent: #2563EB;
    --opus: #8B7CF6; --sonnet: #4F8DF7; --haiku: #22B07D; --fable: #E3A72F; --gemini: #0EA5E9; --other: #94A3B8;
    --leak: #D97706; --leakBg: #FEF3C7; --leakBorder: #F59E0B; --saved: #10B981;
    --in: #94A3B8; --out: #2563EB; --cw: #F59E0B; --cr: #22B07D;
    --wall: #9D8FFF; --floor: #FFFFFF; --goldRing: #E5A83B;
  }
  :root[data-theme="dark"] {
    --bg: #090D1A; --bg2: #131A33; --ink: #E8ECF6; --dim: #94A0BC; --card: rgba(16,22,42,.94); --line: #252F4D;
    --ground: #16202C; --lot: #1B2443; --road: #262F4D; --dash: #4D587A; --win: #FFD98A; --winGlow: 1;
    --shadow: 0 18px 50px rgba(0,0,0,.5); --accent: #5B9BFF;
    --opus: #9D8FFF; --sonnet: #5B9BFF; --haiku: #3DDC97; --fable: #F5C66B; --gemini: #38BDF8; --other: #8C98B8;
    --leak: #F59E0B; --leakBg: rgba(245,158,11,.15); --leakBorder: #F59E0B; --saved: #34D399;
    --in: #8C98B8; --out: #5B9BFF; --cw: #F5C66B; --cr: #3DDC97;
    --wall: #6D63B5; --floor: #182036; --goldRing: #F5C66B;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #090D1A; --bg2: #131A33; --ink: #E8ECF6; --dim: #94A0BC; --card: rgba(16,22,42,.94); --line: #252F4D;
      --ground: #16202C; --lot: #1B2443; --road: #262F4D; --dash: #4D587A; --win: #FFD98A; --winGlow: 1;
      --shadow: 0 18px 50px rgba(0,0,0,.5); --accent: #5B9BFF;
      --opus: #9D8FFF; --sonnet: #5B9BFF; --haiku: #3DDC97; --fable: #F5C66B; --gemini: #38BDF8; --other: #8C98B8;
      --leak: #F59E0B; --leakBg: rgba(245,158,11,.15); --leakBorder: #F59E0B; --saved: #34D399;
      --in: #8C98B8; --out: #5B9BFF; --cw: #F5C66B; --cr: #3DDC97;
      --wall: #6D63B5; --floor: #182036; --goldRing: #F5C66B;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font-family: Inter, system-ui, -apple-system, sans-serif; color: var(--ink); overflow: hidden;
         background: radial-gradient(1200px 700px at 10% -10%, var(--bg2), transparent 60%), var(--bg); }
  #stage { position: fixed; inset: 0; } #stage canvas { display: block; outline: none; }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); backdrop-filter: blur(10px); }

  header { position: fixed; top: 0; left: 0; right: 0; display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 12px 18px; pointer-events: none; z-index: 5; flex-wrap: wrap; }
  header .brand { pointer-events: auto; }
  header h1 { margin: 0; font-size: 20px; font-weight: 800; display: flex; align-items: center; gap: 8px; }
  header h1 span.badge { font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 6px; background: var(--accent); color: #fff; vertical-align: middle; }
  header p { margin: 2px 0 0; color: var(--dim); font-size: 13px; }
  .spacer { flex: 1; min-width: 10px; }
  .ctl { pointer-events: auto; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; padding: 7px 12px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); white-space: nowrap; }
  .pill .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--haiku); } .pill.sample .dot { background: var(--fable); }
  .seg { display: inline-flex; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
  .seg button { border: 0; background: none; padding: 6px 10px; border-radius: 7px; font-size: 12px; font-weight: 700; color: var(--dim); }
  .seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }
  .btn { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 7px 12px; min-height: 36px; font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; gap: 6px; }
  .btn:hover { border-color: var(--accent); }

  /* Campus Breadcrumb when inside building (Image 2 style) */
  #breadcrumbBar { position: fixed; top: 12px; left: 18px; display: none; align-items: center; gap: 10px; z-index: 8; pointer-events: auto; }
  #breadcrumbBar button.back { background: var(--card); border: 1.5px solid var(--accent); color: var(--accent); font-weight: 800; font-size: 13px; border-radius: 10px; padding: 8px 14px; box-shadow: var(--shadow); }
  #breadcrumbBar .crumb-title { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px 14px; font-size: 14px; font-weight: 800; display: flex; align-items: center; gap: 8px; box-shadow: var(--shadow); }

  #kpis { position: fixed; top: 70px; left: 18px; display: grid; grid-template-columns: repeat(3, auto); gap: 8px; z-index: 4; }
  .kpi { padding: 9px 13px; min-width: 120px; }
  .kpi b { display: block; font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .kpi span { font-size: 11px; font-weight: 700; color: var(--dim); text-transform: uppercase; letter-spacing: .5px; }
  .kpi.leak { border-color: var(--leakBorder); } .kpi.leak b { color: var(--leak); }

  #legend { position: fixed; left: 18px; top: 250px; padding: 10px 14px; font-size: 12px; font-weight: 600; z-index: 4; display: grid; gap: 5px; }
  #legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }

  #days { position: fixed; left: 18px; bottom: 18px; width: 420px; padding: 12px 14px; z-index: 4; }
  #days h3, #tools h3 { margin: 0 0 8px; font-size: 12px; font-weight: 800; color: var(--dim); text-transform: uppercase; letter-spacing: .5px; display: flex; justify-content: space-between; }
  #days svg { width: 100%; height: 70px; display: block; }
  #tools { position: fixed; right: 18px; bottom: 18px; width: 300px; padding: 12px 14px; z-index: 4; }
  .bar { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; font-size: 12px; font-weight: 600; margin-bottom: 5px; }
  .bar .track { grid-column: 1 / -1; height: 6px; border-radius: 4px; background: var(--lot); overflow: hidden; }
  .bar .track div { height: 100%; border-radius: 4px; background: var(--accent); }

  /* Floating Campus Callout Tags (Image 1 style) */
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 2; }
  .tag { position: absolute; transform: translate(-50%, -100%); pointer-events: auto; cursor: pointer; background: #FFFFFF; border: 1.5px solid #D1D5DB;
         border-radius: 18px; padding: 6px 12px; box-shadow: 0 10px 25px rgba(0,0,0,.15); white-space: nowrap; font-size: 12px; font-weight: 700; color: #111827; display: flex; align-items: center; gap: 6px; transition: transform .15s ease, border-color .15s ease; }
  .tag:hover { transform: translate(-50%, -108%) scale(1.04); }
  .tag .icon { font-size: 10px; }
  .tag.optimal { border-color: #D1D5DB; } .tag.optimal .icon { color: #10B981; }
  .tag.warning { border-color: var(--goldRing); background: #FFFDF9; color: #92400E; } .tag.warning .icon { color: #D97706; }
  .tag.sel { border-color: var(--accent); outline: 2px solid var(--accent); }

  /* Floating Interior Room Callout Pills (Image 2 style) */
  .interior-pill { position: absolute; transform: translate(-50%, -100%); pointer-events: none; background: #FFFFFF; border: 1.5px solid #D1D5DB;
                   border-radius: 18px; padding: 6px 12px; font-size: 12px; font-weight: 700; box-shadow: 0 10px 25px rgba(0,0,0,.18); color: #111827; display: flex; align-items: center; gap: 6px; }
  .interior-pill.warn { border-color: var(--goldRing); color: #92400E; background: #FFFDF9; }
  .interior-pill .dot { width: 8px; height: 8px; border-radius: 50%; }

  #panel { position: fixed; top: 70px; right: 16px; bottom: 16px; width: 370px; padding: 18px; overflow-y: auto; z-index: 6; transform: translateX(120%); transition: transform .28s ease; }
  #panel.open { transform: none; }
  #panel .head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  #panel h2 { margin: 0; font-size: 19px; font-weight: 800; overflow-wrap: anywhere; }
  #panel .close { background: none; border: 0; font-size: 22px; color: var(--dim); }
  .fam { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 800; padding: 4px 10px; border-radius: 999px; margin-top: 4px; }
  .leak-banner { margin-top: 10px; padding: 9px 12px; border-radius: 10px; background: var(--leakBg); border: 1px solid var(--leakBorder); color: var(--leak); font-size: 12px; line-height: 1.4; font-weight: 600; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 12px 0; }
  .grid2 div { background: var(--lot); border-radius: 12px; padding: 9px 11px; }
  .grid2 b { display: block; font-size: 18px; font-weight: 800; font-variant-numeric: tabular-nums; } .grid2 span { font-size: 11px; color: var(--dim); font-weight: 700; text-transform: uppercase; }
  .sec { margin-top: 14px; } .sec h4 { margin: 0 0 8px; font-size: 12px; color: var(--dim); text-transform: uppercase; letter-spacing: .5px; display: flex; justify-content: space-between; }
  .stack { display: flex; height: 12px; border-radius: 6px; overflow: hidden; background: var(--lot); }
  .keys { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 10px; margin-top: 8px; font-size: 12px; font-weight: 600; }
  .keys i { display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 6px; }
  .enter-btn { width: 100%; margin-top: 14px; padding: 12px; font-size: 13px; font-weight: 800; border-radius: 12px; background: var(--accent); color: #fff; border: 0; box-shadow: var(--shadow); transition: transform .15s ease, filter .15s ease; }
  .enter-btn:hover { filter: brightness(1.1); transform: translateY(-1px); }
  .note { margin-top: 14px; font-size: 11px; color: var(--dim); line-height: 1.45; }

  /* Modern Native Dialog Styling (compliant with modern-web-guidance) */
  dialog.native-dialog {
    border: 1px solid var(--line); border-radius: 20px; background: var(--card);
    box-shadow: 0 25px 60px rgba(0,0,0,.35); backdrop-filter: blur(12px);
    color: var(--ink); padding: 24px; max-width: 900px; width: 92%; max-height: 88vh; overflow-y: auto;
  }
  dialog.native-dialog::backdrop { background: rgba(0, 0, 0, 0.55); backdrop-filter: blur(5px); }
  .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .modal-header h2 { margin: 0; font-size: 20px; font-weight: 800; }
  table.data-table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 8px; }
  table.data-table th, table.data-table td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
  table.data-table th { color: var(--dim); font-size: 11px; text-transform: uppercase; letter-spacing: .5px; }
  #shareCardCanvas { width: 100%; max-width: 600px; border-radius: 12px; border: 1px solid var(--line); display: block; margin: 0 auto 16px; box-shadow: var(--shadow); }

  @media (max-width: 900px) {
    #kpis { grid-template-columns: repeat(3, 1fr); left: 8px; right: 8px; top: 112px; } .kpi { min-width: 0; padding: 6px 8px; } .kpi b { font-size: 15px; }
    #legend, #tools { display: none; } #days { left: 8px; right: 8px; width: auto; bottom: 8px; }
    #panel { top: auto; left: 8px; right: 8px; bottom: 8px; width: auto; max-height: 62vh; transform: translateY(120%); } #panel.open { transform: none; }
    header p { display: none; }
  }
</style>

      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

<body>
  <div id="stage" aria-label="3D city of your AI developer usage. Each building is one project; taller means more usage."></div>
  <div id="labels"></div>

  <!-- Breadcrumb bar when zoomed inside a building (Image 2 style) -->
  <div id="breadcrumbBar">
    <button class="back" id="backBtn">← Campus</button>
    <div class="crumb-title" id="crumbProjectTitle">
      <span id="crumbName">Service</span>
      <span class="pill" id="crumbStatus" style="padding:3px 8px;font-size:11px;">● Optimal</span>
    </div>
  </div>

  <header id="mainHeader">
    <div class="brand">
      <h1>DevCity <span class="badge">v0.2</span></h1>
      <p id="sub">Personal AI Developer Cockpit · Multi-Tool Observability</p>
    </div>
    <div class="spacer"></div>
    <div class="ctl">
      <span class="pill" id="source"><span class="dot"></span><span id="sourceText">Loading…</span></span>
      <!-- Source Filter Segmented Control -->
      <div class="seg" role="group" aria-label="Filter Source Tool" id="toolFilter">
        <button data-src="all" aria-pressed="true">All Tools</button>
        <button data-src="claude-code" aria-pressed="false">Claude Code</button>
        <button data-src="antigravity" aria-pressed="false">Antigravity</button>
      </div>
      <!-- Metric Segmented Control -->
      <div class="seg" role="group" aria-label="Building height metric">
        <button data-m="cost" aria-pressed="true">Cost</button>
        <button data-m="tokens" aria-pressed="false">Tokens</button>
        <button data-m="hours" aria-pressed="false">Hours</button>
        <button data-m="efficiency" aria-pressed="false" title="Prompt Cache Efficiency">Efficiency</button>
      </div>
      <button class="btn" id="shareBtn" title="Generate Shareable City Card">📸 Share Card</button>
      <button class="btn" id="tableBtn" title="View Accessible Table (Alt+T)">📋 Table</button>
      <button class="btn" id="themeBtn" title="Switch light / dark">◐</button>
    </div>
  </header>

  <div id="kpis"></div>
  <div id="legend" class="card"></div>
  <section id="days" class="card"><h3><span>Last 30 days · cost per day</span><span id="peak"></span></h3><div id="daysChart"></div></section>
  <section id="tools" class="card"><h3><span>Top tools</span><span id="toolTotal"></span></h3><div id="toolBars"></div></section>
  <aside id="panel" class="card" aria-live="polite"></aside>

  <!-- Accessible Table Dialog (Modern Web Guidance native <dialog>) -->
  <dialog class="native-dialog" id="tableModal" aria-label="Accessible Projects Table">
    <div class="modal-header">
      <h2>Accessible Projects Table</h2>
      <button class="btn" id="closeTableBtn">Close (Esc)</button>
    </div>
    <div id="tableContainer"></div>
  </dialog>

  <!-- Social Share Card Dialog (Modern Web Guidance native <dialog>) -->
  <dialog class="native-dialog" id="shareModal" style="max-width: 660px; text-align: center;" aria-label="Social Share Card Generator">
    <div class="modal-header">
      <h2>Share Your AI Dev City</h2>
      <button class="btn" id="closeShareBtn">Close</button>
    </div>
    <p style="font-size:13px;color:var(--dim);margin:0 0 14px;">Anonymized by default. Perfect for X, LinkedIn, or GitHub.</p>
    <canvas id="shareCardCanvas" width="1200" height="630"></canvas>
    <div style="display:flex;gap:10px;justify-content:center;margin-top:14px;">
      <button class="btn" id="downloadCardBtn" style="background:var(--accent);color:#fff;">📥 Download PNG</button>
      <button class="btn" id="copyCardBtn">📋 Copy to Clipboard</button>
    </div>
  </dialog>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const $ = (s) => document.querySelector(s);
const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const FAMS = ['opus', 'sonnet', 'haiku', 'gemini', 'fable', 'other'];
const FAM_NAME = { opus: 'Opus', sonnet: 'Sonnet', haiku: 'Haiku', gemini: 'Gemini', fable: 'Fable', other: 'Other' };

/* ---------- formatting ---------- */
const money = (v) => v >= 1000 ? '$' + (v / 1000).toFixed(1) + 'k' : '$' + (v || 0).toFixed(v < 10 ? 2 : 0);
const big = (v) => v >= 1e9 ? (v / 1e9).toFixed(2) + 'B' : v >= 1e6 ? (v / 1e6).toFixed(1) + 'M' : v >= 1e3 ? (v / 1e3).toFixed(1) + 'k' : String(Math.round(v || 0));
const hrs = (v) => v < 1 ? Math.round((v || 0) * 60) + ' min' : (v || 0).toFixed(1) + ' h';
const sumTok = (t) => (t.input || 0) + (t.output || 0) + (t.cacheWrite || 0) + (t.cacheRead || 0);
const METRIC = {
  cost: { get: p => p.costUSD || 0, fmt: money },
  tokens: { get: p => sumTok(p.tokens || {}), fmt: big },
  hours: { get: p => p.activeHours || 0, fmt: hrs },
  efficiency: { get: p => (p.cacheHitRate || 0) * 100, fmt: v => v.toFixed(0) + '%' }
};
let metric = 'cost';
let activeSource = 'all';
let viewMode = 'city'; // 'city' or 'interior'
let interiorProjectIdx = null;

/* ---------- data ---------- */
async function loadData() {
  const order = [['./data/usage.json', false], ['./data/sample-usage.json', true]];
  if (new URLSearchParams(location.search).has('sample')) order.reverse();
  for (const [url, sample] of order) {
    try { const r = await fetch(url, { cache: 'no-store' }); if (r.ok) { const d = await r.json(); d._sample = sample || d.mock; return d; } } catch {}
  }
  throw new Error('no data');
}

/* ---------- scene ---------- */
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
$('#stage').appendChild(renderer.domElement);
const scene = new THREE.Scene();
const DEFAULT_ZOOM = 1.0;
let isAnimatingToGoal = false;
const goal = { t: new THREE.Vector3(0, 2, 0), z: DEFAULT_ZOOM };
const camera = new THREE.OrthographicCamera(-10, 10, 10, -10, 0.1, 500);
camera.position.set(40, 34, 40);
camera.zoom = DEFAULT_ZOOM;
const controls = new OrbitControls(camera, renderer.domElement);
Object.assign(controls, { enableDamping: true, enablePan: true, minZoom: .3, maxZoom: 5, minPolarAngle: .35, maxPolarAngle: 1.25, autoRotate: !reduceMotion, autoRotateSpeed: .25 });
controls.addEventListener('start', () => { isAnimatingToGoal = false; controls.autoRotate = false; });
controls.addEventListener('change', () => { if (!isAnimatingToGoal) { goal.t.copy(controls.target); goal.z = camera.zoom; } });
const hemi = new THREE.HemisphereLight(0xffffff, 0x8899bb, 1.15); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff, 1.45); sun.position.set(22, 42, 14); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
scene.add(sun);

const themed = [];
const tmat = (v, o = {}) => { const m = new THREE.MeshStandardMaterial({ roughness: .85, ...o }); themed.push([m, v]); return m; };
const M = {
  ground: tmat('--ground'), lot: tmat('--lot'), road: tmat('--road'), dash: tmat('--dash'),
  win: tmat('--win', { emissive: 0xffffff, emissiveIntensity: .1, roughness: .2 }), winOff: tmat('--lot', { roughness: .4 }),
  goldRing: tmat('--goldRing', { roughness: .4, emissive: 0xf59e0b, emissiveIntensity: .3 }),
  beacon: new THREE.MeshBasicMaterial({ color: 0xd97706 }),
  treeWood: new THREE.MeshStandardMaterial({ color: 0x6B4F35, roughness: .9 }),
  treeLeaf: new THREE.MeshStandardMaterial({ color: 0x2E6B43, roughness: .8 }),
  personSkin: new THREE.MeshStandardMaterial({ color: 0xFAD0B0, roughness: .7 }),
  personCoat: new THREE.MeshStandardMaterial({ color: 0xE8ECF6, roughness: .6 }),
  personPants: new THREE.MeshStandardMaterial({ color: 0x334155, roughness: .8 }),
  interiorWall: tmat('--wall', { roughness: .7 }),
  interiorFloor: tmat('--floor', { roughness: .5 }),
  deskWood: new THREE.MeshStandardMaterial({ color: 0xE2E8F0, roughness: .6 }),
  compScreen: new THREE.MeshBasicMaterial({ color: 0x38BDF8 }),
  screenCode: new THREE.MeshBasicMaterial({ color: 0x34D399 }),
  windowGlass: new THREE.MeshStandardMaterial({ color: 0xCFE0FF, transparent: true, opacity: 0.48, roughness: 0.15, metalness: 0.05, depthWrite: false }),
  windowFrame: new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.8 }),
  coffeeCup: new THREE.MeshStandardMaterial({ color: 0xFFFFFF, roughness: 0.3 }),
  whiteboard: new THREE.MeshStandardMaterial({ color: 0xF8FAFC, roughness: 0.2 }),
  lampPost: new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.7 }),
  lampHead: new THREE.MeshStandardMaterial({ color: 0xFFFBEB, emissive: 0xFDE047, emissiveIntensity: 0.6, roughness: 0.2 }),
  cloud: new THREE.MeshStandardMaterial({ color: 0xFFFFFF, roughness: 0.9, transparent: true, opacity: 0.85, flatShading: true })
};
const FAM_MAT = Object.fromEntries(FAMS.map(f => [f, tmat('--' + f, { roughness: .55 })]));
function box(w, h, d, m, x, y, z, parent) { const o = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m); o.position.set(x, y, z); o.castShadow = o.receiveShadow = true; (parent || scene).add(o); return o; }

const CELL = 4.4;
let B = [], cars = [], people = [], trees = [], streetLights = [], clouds = [], officeWorkers = [], cutawayWorkers = [], half = 10, data;
let cityRoot = new THREE.Group(); scene.add(cityRoot);

function spiral(n) {
  const out = [[0, 0]]; let x = 0, z = 0, dx = 1, dz = 0, len = 1;
  while (out.length < n) { for (let k = 0; k < 2 && out.length < n; k++) { for (let i = 0; i < len && out.length < n; i++) { x += dx; z += dz; out.push([x, z]); } [dx, dz] = [-dz, dx]; } len++; }
  return out;
}

/* ---------- Low-poly Pine Trees (Image 1 style) ---------- */
function createTree(x, z) {
  const g = new THREE.Group(); g.position.set(x, 0, z);
  box(.14, .45, .14, M.treeWood, 0, .22, 0, g);
  const cone1 = new THREE.Mesh(new THREE.ConeGeometry(.45, .65, 5), M.treeLeaf);
  cone1.position.set(0, .65, 0); cone1.castShadow = true; g.add(cone1);
  const cone2 = new THREE.Mesh(new THREE.ConeGeometry(.32, .55, 5), M.treeLeaf);
  cone2.position.set(0, .98, 0); cone2.castShadow = true; g.add(cone2);
  cityRoot.add(g); trees.push(g);
}

/* ---------- Low-poly Animated People (Image 1 style) ---------- */
function createPerson(lane, pathAxis = 0, dir = 1) {

  const torso = box(.22, .32, .16, M.personCoat, 0, .28, 0, p);

/* ---------- Street Lights (Lampposts) ---------- */
function createStreetLight(x, z, dirX = 1, dirZ = 0) {
  const g = new THREE.Group(); g.position.set(x, 0, z);
  box(.08, 1.4, .08, M.lampPost, 0, .7, 0, g);

  box(dirX ? armLen : .06, .06, dirZ ? armLen : .06, M.lampPost, dirX * armLen / 2, 1.37, dirZ * armLen / 2, g);

  cityRoot.add(g);

/* ---------- Low-poly Fluffy Clouds ---------- */
function createCloud(x, y, z, scale = 1, speed = 0.4) {
  const cg = new THREE.Group(); cg.position.set(x, y, z);
  box(2.8 * scale, .7 * scale, 1.5 * scale, M.cloud, 0, 0, 0, cg);
  box(1.8 * scale, .6 * scale, 1.2 * scale, M.cloud, .9 * scale, .2 * scale, .2 * scale, cg);
  box(1.7 * scale, .6 * scale, 1.1 * scale, M.cloud, -.9 * scale, .1 * scale, -.1 * scale, cg);
  box(1.4 * scale, .5 * scale, 1.0 * scale, M.cloud, .2 * scale, .4 * scale, 0, cg);

/* ---------- Build Full City Campus ---------- */
function buildCity() {

  }

  Object.assign(sun.shadow.camera, { left: -half, right: half, top: half, bottom: -half, far: 140 }); sun.shadow.camera.updateProjectionMatrix();
  applyFilters();
}

/* ---------- Animation & Render Loop ---------- */
function resize() {
  const w = innerWidth, h = innerHeight, a = w / h, top = Math.max(half * .95, half * 1.45 / a);
  Object.assign(camera, { left: -top * a, right: top * a, top, bottom: -top }); camera.updateProjectionMatrix(); renderer.setSize(w, h);
}
addEventListener('resize', resize);
const clock = new THREE.Clock(), v = new THREE.Vector3();

function frame() {
  const dt = Math.min(clock.getDelta(), .05), k = reduceMotion ? 1 : 1 - Math.pow(.015, dt);
  if (isAnimatingToGoal) {
    controls.target.lerp(goal.t, k);
    camera.zoom += (goal.z - camera.zoom) * k;
    camera.updateProjectionMatrix();
    if (controls.target.distanceTo(goal.t) < 0.02 && Math.abs(goal.z - camera.zoom) < 0.01) {
      controls.target.copy(goal.t);
      camera.zoom = goal.z;
      camera.updateProjectionMatrix();
      isAnimatingToGoal = false;
    }
  }
  controls.update();
  const time = Date.now() * .004;

  if (viewMode === 'city') {
    for (const [i, b] of B.entries()) {
      b.h += (b.target - b.h) * (reduceMotion ? 1 : Math.min(1, dt * 3));
      const activeFloors = Math.max(1, Math.min(10, Math.floor(b.h / b.FH)));
      b.floors.forEach((fl, idx) => { fl.visible = idx < activeFloors; });
      b.roof.position.y = activeFloors * b.FH + .06;

      const hot = state.hover === i || state.selected === i;
      b.mat.emissive.set(hot ? b.mat.color : 0x000000); b.mat.emissiveIntensity = hot ? .25 : 0;

      if (b.beacon && !reduceMotion) {
        const s = 1 + .25 * Math.sin(time); b.beacon.scale.set(s, s, s);
      }
    }

    if (!reduceMotion) {
      // Busy office workers inside the buildings
      for (const w of officeWorkers) {
        if (!w.floor.visible) continue;
        if (w.type === 'typing') {
          w.head.rotation.x = Math.sin(time * 5 + w.seed) * 0.08;
          w.armL.rotation.x = -0.5 + Math.sin(time * 12 + w.seed) * 0.14;
          w.armR.rotation.x = -0.5 + Math.cos(time * 12 + w.seed) * 0.14;
        } else if (w.type === 'walking') {
          w.t = (w.t + w.speed * dt * 0.25) % 1;
          const progress = Math.sin(w.t * Math.PI * 2);
          w.group.position.x = progress * w.range;
          w.group.rotation.y = Math.cos(w.t * Math.PI * 2) >= 0 ? Math.PI / 2 : -Math.PI / 2;
          const legAngle = Math.sin(w.t * 24) * 0.35;
          w.leg1.rotation.x = legAngle;
          w.leg2.rotation.x = -legAngle;
        } else if (w.type === 'gesturing') {
          w.arm.rotation.x = -0.4 + Math.sin(time * 3 + w.seed) * 0.25;
          w.head.rotation.y = Math.sin(time * 2 + w.seed) * 0.2;
        }
      }

      for (const pers of people) {
        pers.s = (pers.s + pers.v * dt * pers.dir + 1) % 1;
        const pos = -half * .85 + pers.s * (half * 1.7);
        if (pers.pathAxis) { pers.p.position.set(pers.lane, 0, pos); pers.p.rotation.y = pers.dir > 0 ? 0 : Math.PI; }
        else { pers.p.position.set(pos, 0, pers.lane); pers.p.rotation.y = pers.dir > 0 ? Math.PI / 2 : -Math.PI / 2; }
        const legAngle = Math.sin(pers.s * 40) * .35;
        pers.leg1.rotation.x = legAngle; pers.leg2.rotation.x = -legAngle;
      }
      for (const c of cars) {
        c.s = (c.s + c.v * dt * c.dir + 1) % 1; const a = -half + .5 + c.s * (half * 2 - 1);
        if (c.axis) { c.c.position.set(c.lane + (c.dir > 0 ? .28 : -.28), 0, a); c.c.rotation.y = c.dir > 0 ? 0 : Math.PI; }
        else { c.c.position.set(a, 0, c.lane + (c.dir > 0 ? -.28 : .28)); c.c.rotation.y = c.dir > 0 ? Math.PI / 2 : -Math.PI / 2; }
      }
      const bound = half * 1.4;
      for (const c of clouds) {
        c.cg.position.x += c.speed * dt * 2.2;
        c.cg.position.y = c.startY + Math.sin(time * 0.5 + c.phase) * 0.2;
        if (c.cg.position.x > bound) c.cg.position.x = -bound;
      }
    }

    for (const [el, b] of tags) {
      const activeFloors = Math.max(1, Math.min(10, Math.floor(b.h / b.FH)));
      v.set(b.g.position.x, activeFloors * b.FH + .9, b.g.position.z).project(camera);
      el.style.left = ((v.x + 1) / 2 * innerWidth) + 'px'; el.style.top = ((1 - v.y) / 2 * innerHeight) + 'px';
    }
  } else if (viewMode === 'interior') {
    if (!reduceMotion) {
      for (const cw of cutawayWorkers) {
        if (cw.type === 'typing') {
          cw.head.rotation.x = Math.sin(time * 5 + cw.seed) * 0.08;
          cw.armL.rotation.x = -0.5 + Math.sin(time * 12 + cw.seed) * 0.14;
          cw.armR.rotation.x = -0.5 + Math.cos(time * 12 + cw.seed) * 0.14;
        } else if (cw.type === 'walking') {
          cw.t = (cw.t + cw.speed * dt * 0.3) % 1;
          const progress = Math.sin(cw.t * Math.PI * 2);
          cw.group.position.z = cw.baseZ + progress * cw.range;
          cw.group.rotation.y = Math.cos(cw.t * Math.PI * 2) >= 0 ? 0 : Math.PI;
          const legAngle = Math.sin(cw.t * 24) * 0.35;
          cw.leg1.rotation.x = legAngle;
          cw.leg2.rotation.x = -legAngle;
        } else if (cw.type === 'gesturing') {
          cw.arm.rotation.x = -0.4 + Math.sin(time * 3 + cw.seed) * 0.25;
          cw.head.rotation.y = Math.sin(time * 2 + cw.seed) * 0.2;
        } else if (cw.type === 'cheer') {
          cw.armL.rotation.z = 0.8 + Math.sin(time * 6) * 0.3;
          cw.armR.rotation.z = -0.8 - Math.sin(time * 6) * 0.3;
        }
      }
    }
    for (const pItem of interiorPillsPositions) {
      v.copy(pItem.pos).project(camera);
      pItem.el.style.left = ((v.x + 1) / 2 * innerWidth) + 'px';
      pItem.el.style.top = ((1 - v.y) / 2 * innerHeight) + 'px';
    }
  }

  renderer.render(scene, camera); requestAnimationFrame(frame);
}

/* ---------- boot ---------- */
data = await loadData();
buildCity(); resize(); retheme(); renderSide();
camera.zoom = DEFAULT_ZOOM; camera.updateProjectionMatrix();
frame();
window.__city = { data, select, setMetric, enterBuilding, exitBuilding };
</script>
